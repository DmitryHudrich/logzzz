<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Logzz — поиск</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0b0f;--surface:#111318;--surface2:#15171f;--surface3:#1b1e28;
    --border:#1e2130;--border-hi:#2e3450;
    --accent:#4f7cff;--accent2:#00e5b0;--danger:#ff4f6a;--warn:#ffb84f;
    --text:#c8cedf;--text-dim:#606880;--text-hi:#eef0f8;
    --mono:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace;
    --r:14px;
  }
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13.5px;line-height:1.6;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(1200px 600px at 80% -10%,rgba(79,124,255,.10),transparent 60%),
               radial-gradient(900px 500px at 0% 0%,rgba(0,229,176,.06),transparent 55%)}
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 20px 90px}
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7a4fff);
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;letter-spacing:-1px;
    box-shadow:0 0 28px rgba(79,124,255,.4)}
  .brand h1{font-size:19px;font-weight:800;color:var(--text-hi);letter-spacing:-.5px}
  .brand small{display:block;color:var(--text-dim);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase}
  .stats{display:flex;gap:18px;color:var(--text-dim);font-size:11.5px;flex-wrap:wrap}
  .stats b{color:var(--text-hi);font-weight:700}
  .stats .dot{color:var(--accent2)}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:sticky;top:12px;z-index:5;
    backdrop-filter:blur(6px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .searchrow{display:flex;gap:10px;flex-wrap:wrap}
  .seg{display:flex;background:var(--surface2);border:1px solid var(--border-hi);border-radius:10px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--text-dim);font-family:var(--mono);font-size:12px;padding:0 16px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--accent);color:#fff;font-weight:700}
  .qbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border-hi);border-radius:10px;padding:0 12px}
  .qbox input{flex:1;background:none;border:none;outline:none;color:var(--text-hi);font-family:var(--mono);font-size:14px;padding:11px 0}
  .qbox .ic{color:var(--text-dim)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 22px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:var(--surface2);border:1px solid var(--border-hi);color:var(--text)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .tagbar{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .tagbar .lbl{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-dim)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .chip{border:1px solid var(--border-hi);border-radius:99px;padding:4px 11px;font-size:11px;color:var(--text-dim);
    background:var(--surface2);cursor:pointer;transition:.12s;user-select:none;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--accent2);color:var(--text)}
  .chip.on{border-color:var(--accent2);color:#04120e;background:var(--accent2);font-weight:700}
  .chip.ex{border-color:var(--danger);color:var(--danger);background:rgba(255,79,106,.10);font-weight:700;text-decoration:line-through}
  .chip .x{opacity:.6}
  .chip .x:hover{opacity:1}
  .chip.pick{cursor:pointer;border-style:dashed}
  .chip.pick:hover{border-color:var(--accent2);color:var(--text-hi);border-style:solid}
  .tagadd{display:inline-flex;align-items:center;background:var(--surface2);border:1px dashed var(--border-hi);border-radius:99px;padding:2px 4px 2px 10px}
  .tagadd input{background:none;border:none;outline:none;color:var(--text-hi);font-family:var(--mono);font-size:11px;width:120px;padding:3px 0}
  .hint{color:var(--text-dim);font-size:10.5px}
  .chk{display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);font-size:11.5px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
  .hactions{display:flex;gap:8px}
  .drop{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--border-hi);
    border-radius:10px;padding:10px 12px;color:var(--text-dim);font-size:12px;transition:.15s}
  .drop.drag{border-color:var(--accent);background:rgba(79,124,255,.06);color:var(--text)}
  .drop b{color:var(--text)}
  .btn.sm{padding:0 12px;height:30px;line-height:30px;font-size:11px}
  #livedot{margin-left:auto;color:var(--text-dim)}
  #livedot.on{color:var(--accent2)}
  #livedot.off{color:var(--danger)}
  .progress{display:flex;flex-direction:column;gap:8px;margin:16px 2px 0}
  .prow{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;
    opacity:0;transform:translateY(6px);animation:up .25s ease forwards}
  .prow .top{display:flex;justify-content:space-between;gap:10px;font-size:12px}
  .prow .nm{color:var(--text-hi);word-break:break-all}
  .prow .ph{color:var(--text-dim);white-space:nowrap}
  .prow .ph.ok{color:var(--accent2)}
  .prow .ph.warn{color:var(--warn)}
  .prow .ph.err{color:var(--danger)}
  .bar{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
  .bar>i.ind{width:40% !important;animation:slide 1.1s ease-in-out infinite}
  .bar>i.ok{background:var(--accent2)}
  .bar>i.warn{background:var(--warn)}
  .bar>i.err{background:var(--danger)}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
  .pwform{display:flex;flex-direction:column;gap:6px;margin-top:4px;width:100%}
  .pwrow{display:flex;gap:8px}
  .pwrow input{flex:1;background:var(--surface2);border:1px solid var(--warn);border-radius:8px;color:var(--text-hi);
    font-family:var(--mono);font-size:12px;padding:7px 10px;outline:none}
  .pwerr{color:var(--danger);font-size:11px;word-break:break-all}

  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 2px 12px;flex-wrap:wrap}
  .meta .res{color:var(--text-dim);font-size:12px}
  .meta .res b{color:var(--text-hi)}
  .pager{display:flex;gap:8px;align-items:center}
  .pager .pg{color:var(--text-dim);font-size:12px;min-width:80px;text-align:center}

  .cards{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
    opacity:0;transform:translateY(6px);animation:up .3s ease forwards;transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:var(--border-hi);box-shadow:0 6px 30px rgba(0,0,0,.4)}
  @keyframes up{to{opacity:1;transform:none}}
  .ctop{display:flex}
  .cidx{width:46px;min-width:46px;display:grid;place-items:center;background:rgba(255,255,255,.02);
    border-right:1px solid var(--border);color:var(--text-dim);font-size:10px}
  .cbody{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .field{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .k{font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-dim);min-width:74px;flex-shrink:0}
  .v{color:var(--text-hi);word-break:break-all;min-width:0}
  .v.url{color:var(--accent2)}
  .v.pass{color:var(--danger);font-weight:600}
  .mini{background:none;border:1px solid var(--border-hi);border-radius:6px;color:var(--text-dim);
    font-family:var(--mono);font-size:10px;padding:1px 7px;cursor:pointer;transition:.12s;margin-left:2px}
  .mini:hover{color:var(--text-hi);border-color:var(--accent)}
  .src{padding-top:8px;border-top:1px solid var(--border)}
  .paths{display:none;flex-direction:column;gap:3px;padding:4px 0 0 84px}
  .paths.open{display:flex}
  .paths .p{color:var(--text-dim);font-size:11px;word-break:break-all}
  .ctags{padding-top:9px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent2);color:var(--accent2);
    background:rgba(0,229,176,.09);border-radius:99px;padding:3px 6px 3px 11px;font-size:11px;font-weight:700}
  .tg button{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:13px;line-height:1;opacity:.7;padding:0 2px}
  .tg button:hover{opacity:1;color:var(--danger)}

  .state{text-align:center;padding:70px 20px;color:var(--text-dim)}
  .state .big{font-size:40px;margin-bottom:12px;opacity:.5}
  .spinner{width:26px;height:26px;border:3px solid var(--border-hi);border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--surface3);border:1px solid var(--border-hi);color:var(--text-hi);padding:10px 18px;border-radius:10px;
    font-size:12px;transition:.25s;z-index:50;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--danger);color:#ffd0d8}
  @media(max-width:560px){.k{min-width:0}.cidx{display:none}.paths{padding-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">Lz</div>
      <div><h1>Logzz</h1><small>credential search</small></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="hactions">
      <button class="mini" id="bell" title="Уведомления в браузере">🔔 уведомления</button>
      <button class="mini" id="gear" title="REST API токен">⚙ токен</button>
    </div>
  </header>

  <div class="panel">
    <div class="searchrow">
      <div class="seg" id="seg">
        <button data-type="url" class="on">URL</button>
        <button data-type="login">Login</button>
      </div>
      <label class="qbox">
        <span class="ic">⌕</span>
        <input id="q" type="text" placeholder="домен, url или логин…" autocomplete="off" spellcheck="false"/>
      </label>
      <button class="btn" id="go">Искать</button>
    </div>
    <div class="tagbar">
      <span class="lbl">Фильтр по тегам · клик: <span style="color:var(--accent2)">включить</span> → <span style="color:var(--danger)">исключить</span> → сброс</span>
      <div class="chips" id="filterchips">
        <span class="hint">тегов пока нет</span>
      </div>
      <label class="chk"><input type="checkbox" id="complete"/> только полные записи (url + логин + пароль)</label>
    </div>
    <div class="drop" id="drop">
      <span>⬆ перетащи <b>.zip</b>/<b>.rar</b> сюда или</span>
      <label class="btn ghost sm">выбери файл<input id="file" type="file" accept=".zip,.rar" multiple hidden/></label>
      <span class="hint" id="livedot">● live</span>
    </div>
  </div>

  <div class="lbl" id="qhead" style="display:none;margin:18px 2px 0">очередь архивов и загрузки</div>
  <div class="progress" id="progress"></div>

  <div class="meta" id="meta" style="display:none">
    <div class="res" id="resinfo"></div>
    <div class="pager">
      <button class="btn ghost" id="prev">◀</button>
      <span class="pg" id="pg"></span>
      <button class="btn ghost" id="next">▶</button>
    </div>
  </div>

  <div class="cards" id="cards"></div>
  <div class="state" id="state">
    <div class="big">🔎</div>
    <div>Введи запрос или выбери теги и нажми «Искать».</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const S={type:"url",q:"",tags:new Set(),exclude:new Set(),page:0,hasNext:false,total:0,avail:[]};
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const esc=s=>(s==null?"":String(s));
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className="toast show"+(err?" err":"");setTimeout(()=>t.className="toast",2200);}
function token(){return localStorage.getItem("logzz_token")||"";}
function authHeaders(extra){const h=Object.assign({},extra||{});const t=token();if(t)h["Authorization"]="Bearer "+t;return h;}
async function api(path,opts){
  opts=opts||{};opts.headers=authHeaders(opts.headers);
  const r=await fetch(path,opts);
  const txt=await r.text();
  let data=null;try{data=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok){const m=(data&&data.message)?data.message:("HTTP "+r.status);throw new Error(m);}
  return data;
}
function copy(v){navigator.clipboard.writeText(v).then(()=>toast("Скопировано")).catch(()=>toast("Не удалось скопировать",true));}

async function loadStats(){
  try{
    const m=await api("/metrics");
    $("#stats").innerHTML=`<span><b>${m.total_credentials.toLocaleString()}</b> учёток</span>`+
      `<span class="dot">·</span><span><b>${m.total_source_files.toLocaleString()}</b> файлов</span>`+
      `<span class="dot">·</span><span>в очереди <b>${m.import.pending_archives}</b></span>`;
  }catch(e){$("#stats").innerHTML=`<span class="hint">metrics: ${esc(e.message)}</span>`;}
}
async function loadTags(){
  try{
    const d=await api("/api/tags");
    S.avail=(d&&d.tags)?d.tags:[];
  }catch(e){S.avail=[];}
  renderFilterChips();
}
function renderFilterChips(){
  const box=$("#filterchips");box.innerHTML="";
  const all=new Set([...S.avail,...S.tags,...S.exclude]);
  if(all.size===0){box.appendChild(el("span","hint","тегов пока нет — добавь их на карточке результата"));}
  [...all].sort().forEach(tag=>{
    const state=S.tags.has(tag)?"on":S.exclude.has(tag)?"ex":"";
    const c=el("span","chip"+(state?" "+state:""),tag);
    c.title=state==="on"?"включён (нажми — исключить)":state==="ex"?"исключён (нажми — убрать)":"нажми — включить";
    c.onclick=()=>{
      if(S.tags.has(tag)){S.tags.delete(tag);S.exclude.add(tag);}
      else if(S.exclude.has(tag)){S.exclude.delete(tag);}
      else{S.tags.add(tag);}
      renderFilterChips();search(0);
    };
    box.appendChild(c);
  });
  const add=el("span","tagadd");
  const inp=el("input");inp.placeholder="+ тег";inp.setAttribute("list","availtags");
  inp.onkeydown=e=>{if(e.key==="Enter"){const v=inp.value.trim();if(v){S.tags.add(v);inp.value="";renderFilterChips();search(0);}}};
  add.appendChild(inp);box.appendChild(add);
  let dl=$("#availtags");if(!dl){dl=el("datalist");dl.id="availtags";document.body.appendChild(dl);}
  dl.innerHTML="";S.avail.forEach(t=>{const o=el("option");o.value=t;dl.appendChild(o);});
}

function setBusy(b){
  if(b){$("#state").style.display="block";$("#state").innerHTML='<div class="spinner"></div><div>Ищу…</div>';$("#cards").innerHTML="";$("#meta").style.display="none";}
}
async function search(page){
  S.q=$("#q").value.trim();S.page=page||0;
  if(!S.q && S.tags.size===0 && S.exclude.size===0){toast("Введи запрос или выбери тег",true);return;}
  setBusy(true);
  const p=new URLSearchParams();p.set("type",S.type);if(S.q)p.set("q",S.q);
  if(S.tags.size)p.set("tags",[...S.tags].join(","));
  if(S.exclude.size)p.set("exclude_tags",[...S.exclude].join(","));
  if($("#complete").checked)p.set("complete","1");
  p.set("page",S.page);
  try{
    const d=await api("/api/search?"+p.toString());
    S.hasNext=d.has_next;S.total=d.total_unique;
    render(d);
  }catch(e){
    $("#state").style.display="block";$("#cards").innerHTML="";$("#meta").style.display="none";
    $("#state").innerHTML=`<div class="big">⚠️</div><div>Ошибка: ${esc(e.message)}</div>`;
  }
}
function render(d){
  const cards=$("#cards");cards.innerHTML="";
  if(!d.records.length){
    $("#state").style.display="block";$("#meta").style.display="none";
    $("#state").innerHTML=`<div class="big">📭</div><div>Ничего не найдено.</div>`;return;
  }
  $("#state").style.display="none";$("#meta").style.display="flex";
  const from=d.page*50+1,to=from+d.records.length-1;
  $("#resinfo").innerHTML=`записи <b>${from}–${to}</b> из <b>${d.total_unique.toLocaleString()}</b> уникальных`;
  $("#pg").textContent="стр. "+(d.page+1);
  $("#prev").disabled=d.page<=0;$("#next").disabled=!d.has_next;
  d.records.forEach((r,i)=>cards.appendChild(card(r,d.page*50+i+1)));
}
function card(r,n){
  const c=el("div","card");c.style.animationDelay=((n-1)%50)*22+"ms";
  const top=el("div","ctop");
  top.appendChild(el("div","cidx","#"+String(n).padStart(3,"0")));
  const b=el("div","cbody");

  b.appendChild(field("URL",linkval(r.url),"url"));
  b.appendChild(field("USERNAME",valWithCopy(r.username)));
  b.appendChild(field("PASSWORD",passVal(r.password),"pass"));

  const src=field("SOURCE",document.createTextNode(r.primary_path||"—"));src.classList.add("src");
  if(r.all_paths&&r.all_paths.length>1){
    const btn=el("button","mini",`+${r.all_paths.length-1} путей`);
    const paths=el("div","paths");r.all_paths.forEach(p=>paths.appendChild(el("div","p",p)));
    btn.onclick=()=>paths.classList.toggle("open");
    src.appendChild(btn);b.appendChild(src);b.appendChild(paths);
  }else{b.appendChild(src);}

  b.appendChild(tagsRow(r));
  top.appendChild(b);c.appendChild(top);
  return c;
}
function field(k,node,cls){
  const f=el("div","field");f.appendChild(el("span","k",k));
  const v=el("span","v"+(cls?" "+cls:""));if(typeof node==="string")v.textContent=node;else v.appendChild(node);
  f.appendChild(v);return f;
}
function linkval(url){const a=el("a",null,url||"—");if(url){a.href=url;a.target="_blank";a.rel="noopener";}return a;}
function valWithCopy(val){
  const wrap=el("span");wrap.appendChild(document.createTextNode(val||"—"));
  if(val){const cp=el("button","mini","copy");cp.onclick=()=>copy(val);wrap.appendChild(cp);}
  return wrap;
}
function passVal(val){
  const wrap=el("span");const span=el("span",null,val?"••••••••":"—");wrap.appendChild(span);
  if(val){
    let shown=false;
    const rv=el("button","mini","show");rv.onclick=()=>{shown=!shown;span.textContent=shown?val:"••••••••";rv.textContent=shown?"hide":"show";};
    const cp=el("button","mini","copy");cp.onclick=()=>copy(val);
    wrap.appendChild(rv);wrap.appendChild(cp);
  }
  return wrap;
}
function tagsRow(r){
  const row=el("div","ctags");
  const redraw=()=>{
    row.innerHTML="";
    (r.tags||[]).forEach(t=>{
      const chip=el("span","tg",t);
      const x=el("button",null,"×");x.title="убрать тег";
      x.onclick=()=>mutateTag(r,t,false).then(redraw);
      chip.appendChild(x);row.appendChild(chip);
    });

    const applied=new Set(r.tags||[]);
    S.avail.filter(t=>!applied.has(t)).forEach(t=>{
      const s=el("span","chip pick",t);
      s.title="добавить тег";
      s.onclick=()=>mutateTag(r,t,true).then(redraw);
      row.appendChild(s);
    });

    const add=el("span","tagadd");
    const inp=el("input");inp.placeholder="＋ новый тег";inp.setAttribute("list","availtags");
    inp.onkeydown=e=>{if(e.key==="Enter"){const v=inp.value.trim();if(v){inp.value="";mutateTag(r,v,true).then(redraw);}}};
    add.appendChild(inp);row.appendChild(add);
  };
  redraw();
  r._redraw=redraw;
  return row;
}
async function mutateTag(r,tag,add){
  const body=JSON.stringify({url:r.url,username:r.username,password:r.password,tags:[tag]});
  try{
    const d=await api("/api/tags",{method:add?"POST":"DELETE",headers:{"Content-Type":"application/json"},body});
    r.tags=(d&&d.tags)?d.tags:[];
    toast(add?("Тег добавлен: "+tag):("Тег снят: "+tag));
    loadTags();
  }catch(e){toast("Ошибка тега: "+e.message,true);}
}

$("#seg").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-type]");if(!btn)return;
  S.type=btn.dataset.type;[...$("#seg").children].forEach(b=>b.classList.toggle("on",b===btn));
  if($("#q").value.trim()||S.tags.size||S.exclude.size)search(0);
});
$("#gear").onclick=()=>{
  const t=prompt("REST API токен (пусто = без токена):",token());
  if(t!==null){localStorage.setItem("logzz_token",t.trim());toast(t.trim()?"Токен сохранён":"Токен очищен");loadStats();loadTags();connectSSE();loadQueue();}
};
$("#go").onclick=()=>search(0);
$("#complete").addEventListener("change",()=>{if($("#q").value.trim()||S.tags.size||S.exclude.size)search(0);});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")search(0);});
$("#prev").onclick=()=>{if(S.page>0)search(S.page-1);};
$("#next").onclick=()=>{if(S.hasNext)search(S.page+1);};

const prows=new Map();let uid=0;const pwState=new Map();
function ensureRow(key){
  let r=prows.get(key);
  if(!r){
    const wrap=el("div","prow");const top=el("div","top");
    const nm=el("span","nm");const ph=el("span","ph");top.appendChild(nm);top.appendChild(ph);
    const bar=el("div","bar");const i=el("i");bar.appendChild(i);
    wrap.appendChild(top);wrap.appendChild(bar);$("#progress").appendChild(wrap);
    r={key,archive:null,name:"",el:wrap,nm,ph,bar:i,timer:null};prows.set(key,r);updateQHead();
  }
  return r;
}
function removeRow(key){const r=prows.get(key);if(r){if(r.timer)clearTimeout(r.timer);r.el.remove();prows.delete(key);}updateQHead();}
function updateQHead(){$("#qhead").style.display=prows.size?"block":"none";}
function paint(r,name,label,state,pct){
  if(name)r.name=name;
  r.nm.textContent=r.name;
  r.ph.textContent=label;r.ph.className="ph"+(state==="ok"?" ok":state==="warn"?" warn":state==="err"?" err":"");
  const busy=state==="busy";
  r.bar.className=(busy?"ind":"")+(state==="ok"?" ok":state==="warn"?" warn":state==="err"?" err":"");
  r.bar.style.width=busy?"":(Math.max(0,Math.min(100,pct||0))+"%");
  if(state!=="warn"&&r.pw){r.pw.remove();r.pw=null;}
  if(r.timer){clearTimeout(r.timer);r.timer=null;}
  if(state==="ok"||state==="err")r.timer=setTimeout(()=>removeRow(r.key),state==="ok"?6000:10000);
}
function askPassword(archive){
  let r=findByArchive(archive);
  if(r&&r.pw)return;
  if(!r){r=ensureRow("a:"+archive);r.archive=archive;}
  const st=pwState.get(archive)||{};
  paint(r,r.name||archive,st.error?"пароль не подошёл":"нужен пароль","warn",100);
  const f=el("div","pwform");
  if(st.error)f.appendChild(el("div","pwerr","✗ "+st.error));
  const line=el("div","pwrow");
  const inp=el("input");inp.type="text";inp.placeholder="пароль архива";inp.autocomplete="off";inp.spellcheck=false;
  if(st.value)inp.value=st.value;
  const b=el("button","btn sm","OK");
  const send=()=>{
    const v=inp.value;if(!v)return;
    pwState.set(archive,{value:v});
    b.disabled=true;
    api("/api/archives/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({archive:archive,password:v})})
      .then(()=>{toast("Пароль отправлен, проверяю…");paint(r,r.name||archive,"проверка пароля…","busy",0);loadQueue();})
      .catch(e=>{b.disabled=false;toast("Ошибка: "+e.message,true);});
  };
  b.onclick=send;inp.onkeydown=e=>{if(e.key==="Enter")send();};
  line.appendChild(inp);line.appendChild(b);f.appendChild(line);
  r.el.appendChild(f);r.pw=f;inp.focus();
}
function findByArchive(a){for(const r of prows.values())if(r.archive===a)return r;return null;}
function upsertArchive(a,label,state,pct){
  let r=findByArchive(a);
  if(!r){r=ensureRow("a:"+a);r.archive=a;}
  paint(r,r.name||a,label,state,pct);
}
function handleFiles(list){
  [...list].forEach(file=>{
    const key="u:"+(++uid);const r=ensureRow(key);paint(r,file.name,"загрузка 0%","up",0);
    const fd=new FormData();fd.append("file",file,file.name);
    const xhr=new XMLHttpRequest();xhr.open("POST","/api/archives");
    const t=token();if(t)xhr.setRequestHeader("Authorization","Bearer "+t);
    xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);paint(r,file.name,"загрузка "+p+"%","up",p);}};
    xhr.onload=()=>{
      let d={};try{d=JSON.parse(xhr.responseText||"{}");}catch(_){}
      if(xhr.status>=200&&xhr.status<300&&d.queued){
        const base=(d.path||"").split("/").pop();
        if(base){for(const [k,rr] of prows)if(rr!==r&&rr.archive===base)removeRow(k);r.archive=base;}
        paint(r,file.name,"в очереди","busy",0);
      }else{paint(r,file.name,"ошибка: "+((d&&d.message)||xhr.status),"err",100);toast("Загрузка не удалась",true);}
    };
    xhr.onerror=()=>{paint(r,file.name,"ошибка сети","err",100);toast("Ошибка сети при загрузке",true);};
    xhr.send(fd);
  });
}
function osNotify(title,body){if(window.Notification&&Notification.permission==="granted"){try{new Notification(title,{body});}catch(_){}}}
function handleEvent(ev){
  switch(ev.type){
    case"import":{const m=`Импортировано: +${ev.records_inserted} учёток, +${ev.files_parsed} файлов`;toast(m);osNotify("Logzz — новый импорт",m);loadStats();loadTags();break;}
    case"archive_queued":upsertArchive(ev.archive,"в очереди","busy",0);break;
    case"archive_extracting":upsertArchive(ev.archive,"распаковка","busy",0);break;
    case"archive_done":{pwState.delete(ev.archive);upsertArchive(ev.archive,`готово · ${ev.records_inserted} записей`,"ok",100);osNotify("Архив обработан",`${ev.archive}: ${ev.records_inserted} записей`);loadStats();break;}
    case"archive_needs_password":{askPassword(ev.archive);break;}
    case"archive_failed":{
      const em=ev.error?(": "+ev.error):"";
      if(pwState.has(ev.archive)){
        const cur=pwState.get(ev.archive)||{};
        pwState.set(ev.archive,{value:cur.value,error:ev.error||"не удалось распаковать (проверь пароль)"});
        if(findByArchive(ev.archive)){const rr=findByArchive(ev.archive);if(rr.pw){rr.pw.remove();rr.pw=null;}}
        askPassword(ev.archive);
        toast("Пароль не подошёл"+em,true);osNotify("Пароль не подошёл",ev.archive+em);
      }else{
        upsertArchive(ev.archive,"ошибка"+em,"err",100);
        toast("Ошибка распаковки "+ev.archive+em,true);osNotify("Ошибка распаковки",ev.archive+em);
      }
      break;
    }
    case"problem":{toast("Проблема импорта: "+ev.message,true);osNotify("Проблема импорта",ev.message);break;}
  }
}
function markQ(archive){const r=findByArchive(archive);if(r)r.q=true;}
async function loadQueue(){
  let d;try{d=await api("/api/archives/queue");}catch(e){return;}
  const items=d.archives||[];const names=new Set(items.map(i=>i.name));
  items.forEach(it=>{
    if(it.status==="needs_password")askPassword(it.name);
    else if(it.status==="password_submitted")upsertArchive(it.name,"проверка пароля…","busy",0);
    else upsertArchive(it.name,"в очереди","busy",0);
    markQ(it.name);
  });
  for(const [k,r] of [...prows])if(r.q&&r.archive&&!names.has(r.archive))removeRow(k);
}
let es=null;
function connectSSE(){
  if(es)es.close();
  const t=token();const url="/api/events"+(t?("?token="+encodeURIComponent(t)):"");
  es=new EventSource(url);
  const dot=$("#livedot");
  es.onopen=()=>{dot.className="on";dot.textContent="● live";loadQueue();};
  es.onmessage=e=>{try{handleEvent(JSON.parse(e.data));}catch(_){}};
  es.onerror=()=>{dot.className="off";dot.textContent="● offline";};
}
$("#bell").onclick=()=>{
  if(!window.Notification){toast("Браузер не поддерживает уведомления",true);return;}
  Notification.requestPermission().then(p=>toast(p==="granted"?"OS-уведомления включены":"Уведомления отклонены",p!=="granted"));
};
const drop=$("#drop");
["dragenter","dragover"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add("drag");}));
["dragleave","drop"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove("drag");}));
drop.addEventListener("drop",e=>{if(e.dataTransfer&&e.dataTransfer.files)handleFiles(e.dataTransfer.files);});
$("#file").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value="";});

loadStats();loadTags();connectSSE();loadQueue();setInterval(loadQueue,5000);
</script>
